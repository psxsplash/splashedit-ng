name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        shell: bash
        run: |
          cli=build/cli/splashpack-cli
          [ -f build/cli/Release/splashpack-cli.exe ] && cli=build/cli/Release/splashpack-cli.exe
          py=python3; command -v python3 >/dev/null || py=python
          "$py" tests/roundtrip.py "$cli"
          "$py" tests/luacheck.py "$cli"
          "$py" tests/audiocheck.py "$cli"
          "$py" tests/uicheck.py "$cli"
          "$py" tests/cutscenecheck.py "$cli"
      - name: Editor tests
        run: ctest --test-dir build -C Release --output-on-failure
